<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Banc de régression</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fbfaf7'/%3E%3Crect x='2' y='4' width='12' height='1' fill='%23111'/%3E%3Crect x='2' y='7' width='12' height='1' fill='%23111'/%3E%3Crect x='2' y='11' width='12' height='2' fill='%23111'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/registre.css" />
</head>
<body>
<main>
  <div class="haut">
    <div><h1 id="h1"></h1><p class="lede" id="lede"></p></div>
    <div class="lang"><button id="fr" type="button">FR</button><button id="en" type="button">EN</button></div>
  </div>

  <h2 id="titreVersions"></h2>
  <div id="versions"></div>

  <h2 id="titreComparaison"></h2>
  <div id="comparaison"></div>

  <h2 id="titreStabilite"></h2>
  <div id="stabilite"></div>

  <p class="renvoi" id="provenanceLegende"></p>
</main>

<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const api = async (pathFor, methode) => (await fetch(pathFor, methode ? { method: methode } : {})).json();

/**
 * Les deux langues.
 *
 * Le moteur ne fabrique aucune phrase : il renvoie des structures, l'écran les formule.
 * La leçon vient du projet précédent, où un moteur français alimentait un écran anglais.
 */
const T = {
  fr: {
    h1: "Banc de régression",
    provenance: "Chaque chiffre de cette page est <b>retrouvé</b> dans un texte public, <b>mesuré</b> en faisant tourner le code, <b>supposé</b> parce que personne ici ne peut le connaître, ou <b>choisi</b> par moi. Le README dit lequel, un par un.",
    lede: "Un banc qui ne donne pas une note mais dit ce qui a changé. Une justesse qui monte peut cacher des cas qui viennent de casser — et sur un système de conformité, c'est presque toujours la mauvaise nouvelle.",
    titreVersions: "Les versions évaluées",
    versionsQuoi: (n) => `Le même jeu de ${n} cas de contrôle, passé sur quatre versions successives d'un criblage de noms contre une liste de sanctions.`,
    relancer: "Relancer les quatre versions",
    titreComparaison: "Comparer deux versions",
    comparer: "Comparer", avant: "avant", apres: "après",

    regression: (n) => `${n} régression${n > 1 ? "s" : ""} — changement suspect`,
    regressionQuoi: (g, a, b) => g > 0
      ? `Le taux passe de ${a} à ${b}, et pourtant des cas validés ne passent plus. Une moyenne qui monte ne rachète pas un comportement qu'on ne sait plus expliquer.`
      : `Le taux passe de ${a} à ${b}.`,
    amelioration: (n) => `${n} gain${n > 1 ? "s" : ""}, aucune régression`,
    ameliorationQuoi: (a, b) => `${a} → ${b}. Rien de ce qui marchait n'a cessé de marcher.`,
    neutre: "Aucun changement de verdict",
    neutreQuoi: (b) => `${b} des deux côtés, cas par cas.`,
    incomparable: "Rien à comparer",
    incomparableQuoi: "Ces deux exécutions n'ont aucun cas en commun.",

    casses: "Ce qui ne marche plus", repares: "Ce qui marche désormais",
    silencieux: (n) => `${n} cas au verdict inchangé mais à la sortie différente`,
    jeuBouge: (a, r) => `Jeu modifié : ${a} cas ajouté(s), ${r} retiré(s) — la comparaison est partielle.`,

    titreStabilite: "Stabilité",
    stabiliteQuoi: "Le même système, le même cas, plusieurs fois. Un cas qui réussit sept fois sur huit n'est pas un cas qui réussit : comparé à demain, il produira des régressions qui n'ont rien à voir avec le code.",
    lancerStabilite: "Mesurer sur 8 tours",
    stable: "stable",
    instable: (n, c, tours) => `${n} — ${c.cas} : ${c.reussites}/${tours}, sorties observées : ${c.sorties.join(" / ")}`,
    toutStable: "Toutes les versions sont stables.",
    aucuneMesure: "Pas encore mesuré.",
    aucun: "aucun", calcul: "Calcul…",
  },
  en: {
    h1: "Regression bench",
    provenance: "Every figure on this page is <b>retrieved</b> from a public source, <b>measured</b> by running the code, <b>assumed</b> because nobody here can know it, or <b>chosen</b> by me. The README says which, one by one.",
    lede: "A bench that doesn't hand you a score — it tells you what changed. A rising pass rate can hide cases that just broke, and on a compliance system that's almost always the bad news.",
    titreVersions: "The versions under test",
    versionsQuoi: (n) => `The same set of ${n} check cases, run against four successive versions of a name screening system matching against a sanctions list.`,
    relancer: "Re-run all four versions",
    titreComparaison: "Compare two versions",
    compare: "Compare", before: "before", after: "after",

    regression: (n) => `${n} regression${n > 1 ? "s" : ""} — change is suspect`,
    regressionQuoi: (g, a, b) => g > 0
      ? `The rate moves from ${a} to ${b}, and yet cases that were validated no longer pass. A rising average doesn't buy back behaviour you can no longer explain.`
      : `The rate moves from ${a} to ${b}.`,
    amelioration: (n) => `${n} gain${n > 1 ? "s" : ""}, no regression`,
    ameliorationQuoi: (a, b) => `${a} → ${b}. Nothing that worked stopped working.`,
    neutre: "No change in verdict",
    neutreQuoi: (b) => `${b} on both sides, case by case.`,
    incomparable: "Nothing to compare",
    incomparableQuoi: "These two runs share no cases.",

    casses: "What stopped working", repares: "What works now",
    silent: (n) => `${n} case(s) with an unchanged verdict but a different output`,
    jeuBouge: (a, r) => `Case set changed: ${a} added, ${r} removed — the comparison is partial.`,

    titreStabilite: "Stability",
    stabiliteQuoi: "The same system, the same case, several times. A case that passes seven times out of eight isn't a case that passes: compared against tomorrow it will produce regressions that have nothing to do with the code.",
    lancerStabilite: "Measure over 8 runs",
    stable: "stable",
    instable: (n, c, runs) => `${n} — ${c.cas}: ${c.passes}/${runs}, outputs seen: ${c.outputs.join(" / ")}`,
    toutStable: "Every version is stable.",
    aucuneMesure: "Not measured yet.",
    aucun: "none", calcul: "Measuring…",
  },
};

let langue = localStorage.getItem("langue") === "en" ? "en" : "fr";
const t = () => T[langue];
const pc = (x) => (x * 100).toFixed(1) + " %";

let state = null, comparaison = null, stabilite = null, occupe = false;
let choixAvant = null, choixApres = null;

function blocVersions() {
  const L = t();
  $("#titreVersions").textContent = L.titreVersions;
  $("#versions").innerHTML = `
    <div class="feuillet"><div class="quoi">${esc(L.versionsQuoi(state.totalCases))}</div>
      <div class="rang"><button class="b" id="relancer" type="button">${esc(L.relancer)}</button></div></div>
    <section class="feuillet"><div class="corps">
      ${state.runs.map((e) => `<div class="ligne">
        <span class="intitule"><span class="reference">${esc(e.version)}</span>
          <small>${e.passed} / ${e.total}</small></span>
        <span class="valeur">${pc(e.rate)}</span></div>`).join("")}
    </div></section>`;
  $("#relancer").onclick = async () => {
    await agir(async () => { const r = await api("/api/run", "POST"); state.runs = r.runs; await charger(); });
  };
}

function blocChoix() {
  const L = t();
  const noms = state.runs.map((e) => e.version);
  if (!noms.includes(choixAvant)) choixAvant = noms[1] ?? noms[0];
  if (!noms.includes(choixApres)) choixApres = noms[2] ?? noms[noms.length - 1];

  const options = (choisi) => noms.map((n) =>
    `<option value="${esc(n)}"${n === choisi ? " selected" : ""}>${esc(n)}</option>`).join("");

  return `<div class="feuillet"><div class="rang">
      <label class="quoi" for="av">${esc(L.before)}</label>
      <select id="av" aria-label="${esc(L.before)}">${options(choixAvant)}</select>
      <label class="quoi" for="ap">${esc(L.after)}</label>
      <select id="ap" aria-label="${esc(L.after)}">${options(choixApres)}</select>
      <button class="b" id="cmp" type="button">${esc(L.compare)}</button>
    </div></div>`;
}

function mouvement(m, classe) {
  const info = state.cases[m.cas] ?? {};
  const val = (v) => JSON.stringify(v ?? null);
  return `<div class="ligne">
    <span class="intitule"><span class="reference">${esc(m.cas)}</span>
      ${esc(JSON.stringify(info.input))}
      <small>${esc(info.why?.[langue] ?? "")}</small></span>
    <span class="valeur ${classe === "casse" ? "defavorable" : "favorable"}">
      ${esc(val(m.before.actual))} \u2192 ${esc(val(m.after.actual))}</span>
  </div>`;
}

function blocComparaison() {
  const L = t();
  $("#titreComparaison").textContent = L.titreComparaison;
  let html = blocChoix();

  if (comparaison && comparaison.error) {
    // Peut arriver si une exécution disparaît entre le chargement de l'écran et le clic.
    html += `<div class="verdict neutre"><div class="t">${esc(L.incomparable)}</div>
      <div class="d">${esc(L.incomparableQuoi)}</div></div>`;
  } else if (comparaison) {
    const c = comparaison;
    const a = pc(c.rateBefore), b = pc(c.rateAfter);
    const carte = c.verdict === "regression"
      ? { cl: "mauvais", t: L.regression(c.regressions.length), d: L.regressionQuoi(c.gains.length, a, b) }
      : c.verdict === "amelioration"
      ? { cl: "bon", t: L.amelioration(c.gains.length), d: L.ameliorationQuoi(a, b) }
      : c.verdict === "neutre"
      ? { cl: "neutre", t: L.neutre, d: L.neutreQuoi(b) }
      : { cl: "neutre", t: L.incomparable, d: L.incomparableQuoi };

    const solde = c.verdict === "regression" ? "defavorable"
      : c.verdict === "amelioration" ? "favorable" : "attente";
    html += `<section class="feuillet"><div class="corps">
      <div class="ligne"><span class="intitule">${esc(L.before)} · ${esc(c.before)}</span>
        <span class="valeur">${pc(c.rateBefore)}</span></div>
      <div class="ligne"><span class="intitule">${esc(L.after)} · ${esc(c.after)}</span>
        <span class="valeur">${pc(c.rateAfter)}</span></div>
      <div class="ligne"><span class="intitule">${esc(L.repares)}</span>
        <span class="valeur">+${c.gains.length}</span></div>
      <div class="ligne"><span class="intitule">${esc(L.casses)}</span>
        <span class="valeur">\u2212${c.regressions.length}</span></div>
      <div class="ligne total ${solde}"><span class="intitule">${esc(carte.t)}</span>
        <span class="valeur">${c.regressions.length ? "\u2717" : c.gains.length ? "\u2713" : "="}</span></div>
      <div class="renvoi ${solde === "defavorable" ? "defavorable" : ""}">${esc(carte.d)}</div>
    </div></section>`;

    // Les cassés d'abord, toujours. C'est l'information qu'on vient chercher.
    if (c.regressions.length) html += `<section class="feuillet"><div class="intitule">${esc(L.casses)}</div>
      <div class="corps">${c.regressions.map((m) => mouvement(m, "casse")).join("")}</div></section>`;
    if (c.gains.length) html += `<section class="feuillet"><div class="intitule">${esc(L.repares)}</div>
      <div class="corps">${c.gains.map((m) => mouvement(m, "repare")).join("")}</div></section>`;

    const notes = [];
    if (c.silent.length) notes.push(L.silent(c.silent.length));
    if (c.added.length || c.removed.length) notes.push(L.jeuBouge(c.added.length, c.removed.length));
    if (notes.length) html += `<div class="feuillet"><div class="quoi">${notes.map(esc).join("<br>")}</div></div>`;
  }

  $("#comparaison").innerHTML = html;
  $("#av").onchange = (e) => { choixAvant = e.target.value; };
  $("#ap").onchange = (e) => { choixApres = e.target.value; };
  $("#cmp").onclick = () => agir(async () => {
    comparaison = await api(`/api/compare?before=${encodeURIComponent(choixAvant)}&after=${encodeURIComponent(choixApres)}`);
  });
}

function blocStabilite() {
  const L = t();
  $("#titreStabilite").textContent = L.titreStabilite;
  let html = `<div class="feuillet"><div class="quoi">${esc(L.stabiliteQuoi)}</div>
    <div class="rang"><button class="b" id="stab" type="button">${esc(L.lancerStabilite)}</button></div></div>`;

  if (stabilite) {
    const unstable = stabilite.versions.filter((v) => !v.stable);
    html += unstable.length === 0
      ? `<div class="vide">${esc(L.toutStable)}</div>`
      : unstable.flatMap((v) => v.unstable.map((c) =>
          `<div class="renvoi attention">${esc(L.instable(v.version, c, stabilite.runs))}</div>`)).join("");
  } else {
    html += `<div class="vide">${esc(L.aucuneMesure)}</div>`;
  }

  $("#stabilite").innerHTML = html;
  $("#stab").onclick = () => agir(async () => { stabilite = await api("/api/stability?runs=8", "POST"); });
}

function dessiner() {
  const L = t();
  document.documentElement.lang = langue;
  $("#h1").textContent = L.h1;
  $("#provenanceLegende").innerHTML = L.provenance;
  $("#lede").textContent = L.lede;
  $("#fr").className = langue === "fr" ? "on" : "";
  $("#en").className = langue === "en" ? "on" : "";
  blocVersions(); blocComparaison(); blocStabilite();
}

async function agir(travail) {
  if (occupe) return;
  occupe = true;
  for (const b of document.querySelectorAll("button.b")) b.disabled = true;
  try { await travail(); dessiner(); }
  finally {
    occupe = false;
    for (const b of document.querySelectorAll("button.b")) b.disabled = false;
  }
}

async function charger() { state = await api("/api/state"); }

for (const l of ["fr", "en"]) {
  $(`#${l}`).onclick = () => { langue = l; localStorage.setItem("langue", l); dessiner(); };
}

await charger();
dessiner();
</script>
</body>
</html>
