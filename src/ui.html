<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Banc de régression</title>
<style>
  :root {
    --bg:#faf9f7; --panel:#fff; --line:#e4e2dd; --line-fort:#d0cdc6;
    --text:#1a1a18; --muted:#69675f; --faint:#9a978e;
    --accent:#1d6b52; --accent-soft:#eef4f1;
    --warn:#8a5410; --warn-soft:#fbf2e4; --danger:#93312e; --danger-soft:#faece9;
    --serif: ui-serif, Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#131416; --panel:#1c1d20; --line:#2b2c30; --line-fort:#3a3c41;
      --text:#e8e7e3; --muted:#9a9891; --faint:#6a6862;
      --accent:#4fbb94; --accent-soft:#16302a;
      --warn:#dda15e; --warn-soft:#2f2416; --danger:#d98682; --danger-soft:#2c1a19; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:15px/1.65 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  main { max-width:900px; margin:0 auto; padding:40px 24px 120px; }

  .haut { display:flex; justify-content:space-between; align-items:flex-start; gap:20px;
    flex-wrap:wrap; margin-bottom:24px; }
  h1 { font-family:var(--serif); font-size:25px; font-weight:400; margin:0 0 6px; letter-spacing:-0.01em; }
  .lede { color:var(--muted); font-size:13.5px; margin:0; max-width:620px; }
  .lang { display:flex; border:1px solid var(--line-fort); border-radius:7px; overflow:hidden; flex:0 0 auto; }
  .lang button { border:0; background:none; padding:9px 13px; font:inherit; font-size:12px;
    letter-spacing:.03em; color:var(--muted); cursor:pointer; min-height:38px; }
  .lang button.on { background:var(--text); color:var(--bg); font-weight:500; }

  h2 { font-size:13px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    color:var(--muted); margin:32px 0 12px; }

  .carte { background:var(--panel); border:1px solid var(--line); border-radius:9px;
    padding:17px 19px; margin-bottom:12px; }
  .quoi { color:var(--muted); font-size:13px; }

  .versions { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:1px; background:var(--line); border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .v { background:var(--panel); padding:14px 16px; }
  .v b { display:block; font-size:22px; font-weight:500; font-variant-numeric:tabular-nums;
    letter-spacing:-0.02em; line-height:1.2; }
  .v span { font-size:11.5px; color:var(--muted); }
  .v code { font-size:11.5px; color:var(--accent); font-family:ui-monospace,Menlo,monospace; }

  .choix { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  select { font:inherit; font-size:13.5px; padding:9px 11px; min-height:42px;
    border:1px solid var(--line-fort); border-radius:7px; background:var(--bg); color:var(--text); }
  select:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button.b { font:inherit; font-size:13.5px; padding:10px 15px; min-height:44px;
    border:1px solid var(--line-fort); border-radius:7px; background:var(--panel);
    color:var(--text); cursor:pointer; }
  button.b:hover:not(:disabled) { border-color:var(--text); }
  /* Le seul repère de quelqu'un qui navigue au clavier. */
  button.b:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button.b:disabled { opacity:.4; cursor:default; }

  .verdict { border-radius:9px; padding:16px 19px; margin-bottom:12px; }
  .verdict .t { font-weight:600; font-size:15px; }
  .verdict .d { font-size:13.5px; margin-top:5px; line-height:1.6; }
  .verdict.mauvais { background:var(--danger-soft); color:var(--danger); }
  .verdict.bon { background:var(--accent-soft); color:var(--accent); }
  .verdict.neutre { background:var(--panel); border:1px solid var(--line); color:var(--muted); }

  .mouv { border:1px solid var(--line); border-radius:8px; padding:13px 15px; margin-bottom:9px;
    background:var(--panel); }
  .mouv.casse { border-left:3px solid var(--danger); }
  .mouv.repare { border-left:3px solid var(--accent); }
  .mouv .id { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--muted); }
  .mouv .entree { font-weight:500; margin-top:3px; }
  .mouv .pq { color:var(--faint); font-size:12px; margin-top:3px; }
  .mouv .chg { font-size:12.5px; margin-top:7px; font-family:ui-monospace,Menlo,monospace; }
  .av { color:var(--muted); } .ap { color:var(--danger); font-weight:500; }
  .mouv.repare .ap { color:var(--accent); }

  .instable { border:1px solid var(--warn); background:var(--warn-soft); color:var(--warn);
    border-radius:8px; padding:12px 15px; margin-bottom:9px; font-size:13.5px; }
  .vide { color:var(--muted); font-size:13.5px; background:var(--panel);
    border:1px dashed var(--line-fort); border-radius:9px; padding:20px; text-align:center; }
</style>
</head>
<body>
<main>
  <div class="haut">
    <div><h1 id="h1"></h1><p class="lede" id="lede"></p></div>
    <div class="lang"><button id="fr" type="button">FR</button><button id="en" type="button">EN</button></div>
  </div>

  <h2 id="titreVersions"></h2>
  <div id="versions"></div>

  <h2 id="titreComparaison"></h2>
  <div id="comparaison"></div>

  <h2 id="titreStabilite"></h2>
  <div id="stabilite"></div>
</main>

<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const api = async (chemin, methode) => (await fetch(chemin, methode ? { method: methode } : {})).json();

/**
 * Les deux langues.
 *
 * Le moteur ne fabrique aucune phrase : il renvoie des structures, l'écran les formule.
 * La leçon vient du projet précédent, où un moteur français alimentait un écran anglais.
 */
const T = {
  fr: {
    h1: "Banc de régression",
    lede: "Un banc qui ne donne pas une note mais dit ce qui a changé. Une justesse qui monte peut cacher des cas qui viennent de casser — et sur un système de conformité, c'est presque toujours la mauvaise nouvelle.",
    titreVersions: "Les versions évaluées",
    versionsQuoi: (n) => `Le même jeu de ${n} cas de contrôle, passé sur quatre versions successives d'un criblage de noms contre une liste de sanctions.`,
    relancer: "Relancer les quatre versions",
    titreComparaison: "Comparer deux versions",
    comparer: "Comparer", avant: "avant", apres: "après",

    regression: (n) => `${n} régression${n > 1 ? "s" : ""} — changement suspect`,
    regressionQuoi: (g, a, b) => g > 0
      ? `Le taux passe de ${a} à ${b}, et pourtant des cas validés ne passent plus. Une moyenne qui monte ne rachète pas un comportement qu'on ne sait plus expliquer.`
      : `Le taux passe de ${a} à ${b}.`,
    amelioration: (n) => `${n} gain${n > 1 ? "s" : ""}, aucune régression`,
    ameliorationQuoi: (a, b) => `${a} → ${b}. Rien de ce qui marchait n'a cessé de marcher.`,
    neutre: "Aucun changement de verdict",
    neutreQuoi: (b) => `${b} des deux côtés, cas par cas.`,
    incomparable: "Rien à comparer",
    incomparableQuoi: "Ces deux exécutions n'ont aucun cas en commun.",

    casses: "Ce qui ne marche plus", repares: "Ce qui marche désormais",
    silencieux: (n) => `${n} cas au verdict inchangé mais à la sortie différente`,
    jeuBouge: (a, r) => `Jeu modifié : ${a} cas ajouté(s), ${r} retiré(s) — la comparaison est partielle.`,

    titreStabilite: "Stabilité",
    stabiliteQuoi: "Le même système, le même cas, plusieurs fois. Un cas qui réussit sept fois sur huit n'est pas un cas qui réussit : comparé à demain, il produira des régressions qui n'ont rien à voir avec le code.",
    lancerStabilite: "Mesurer sur 8 tours",
    stable: "stable",
    instable: (n, c, tours) => `${n} — ${c.cas} : ${c.reussites}/${tours}, sorties observées : ${c.sorties.join(" / ")}`,
    toutStable: "Toutes les versions sont stables.",
    aucuneMesure: "Pas encore mesuré.",
    aucun: "aucun", calcul: "Calcul…",
  },
  en: {
    h1: "Regression bench",
    lede: "A bench that doesn't hand you a score — it tells you what changed. A rising pass rate can hide cases that just broke, and on a compliance system that's almost always the bad news.",
    titreVersions: "The versions under test",
    versionsQuoi: (n) => `The same set of ${n} check cases, run against four successive versions of a name screening system matching against a sanctions list.`,
    relancer: "Re-run all four versions",
    titreComparaison: "Compare two versions",
    comparer: "Compare", avant: "before", apres: "after",

    regression: (n) => `${n} regression${n > 1 ? "s" : ""} — change is suspect`,
    regressionQuoi: (g, a, b) => g > 0
      ? `The rate moves from ${a} to ${b}, and yet cases that were validated no longer pass. A rising average doesn't buy back behaviour you can no longer explain.`
      : `The rate moves from ${a} to ${b}.`,
    amelioration: (n) => `${n} gain${n > 1 ? "s" : ""}, no regression`,
    ameliorationQuoi: (a, b) => `${a} → ${b}. Nothing that worked stopped working.`,
    neutre: "No change in verdict",
    neutreQuoi: (b) => `${b} on both sides, case by case.`,
    incomparable: "Nothing to compare",
    incomparableQuoi: "These two runs share no cases.",

    casses: "What stopped working", repares: "What works now",
    silencieux: (n) => `${n} case(s) with an unchanged verdict but a different output`,
    jeuBouge: (a, r) => `Case set changed: ${a} added, ${r} removed — the comparison is partial.`,

    titreStabilite: "Stability",
    stabiliteQuoi: "The same system, the same case, several times. A case that passes seven times out of eight isn't a case that passes: compared against tomorrow it will produce regressions that have nothing to do with the code.",
    lancerStabilite: "Measure over 8 runs",
    stable: "stable",
    instable: (n, c, tours) => `${n} — ${c.cas}: ${c.reussites}/${tours}, outputs seen: ${c.sorties.join(" / ")}`,
    toutStable: "Every version is stable.",
    aucuneMesure: "Not measured yet.",
    aucun: "none", calcul: "Measuring…",
  },
};

let langue = localStorage.getItem("langue") === "en" ? "en" : "fr";
const t = () => T[langue];
const pc = (x) => (x * 100).toFixed(1) + " %";

let etat = null, comparaison = null, stabilite = null, occupe = false;
let choixAvant = null, choixApres = null;

function blocVersions() {
  const L = t();
  $("#titreVersions").textContent = L.titreVersions;
  $("#versions").innerHTML = `
    <div class="carte"><div class="quoi">${esc(L.versionsQuoi(etat.totalCas))}</div>
      <div class="choix"><button class="b" id="relancer" type="button">${esc(L.relancer)}</button></div></div>
    <div class="versions">${etat.executions.map((e) => `
      <div class="v"><b>${pc(e.taux)}</b>
        <span>${e.reussis}/${e.total}</span><br><code>${esc(e.version)}</code></div>`).join("")}</div>`;
  $("#relancer").onclick = async () => {
    await agir(async () => { const r = await api("/api/lancer", "POST"); etat.executions = r.executions; await charger(); });
  };
}

function blocChoix() {
  const L = t();
  const noms = etat.executions.map((e) => e.version);
  if (!noms.includes(choixAvant)) choixAvant = noms[1] ?? noms[0];
  if (!noms.includes(choixApres)) choixApres = noms[2] ?? noms[noms.length - 1];

  const options = (choisi) => noms.map((n) =>
    `<option value="${esc(n)}"${n === choisi ? " selected" : ""}>${esc(n)}</option>`).join("");

  return `<div class="carte"><div class="choix">
      <label class="quoi" for="av">${esc(L.avant)}</label>
      <select id="av" aria-label="${esc(L.avant)}">${options(choixAvant)}</select>
      <label class="quoi" for="ap">${esc(L.apres)}</label>
      <select id="ap" aria-label="${esc(L.apres)}">${options(choixApres)}</select>
      <button class="b" id="cmp" type="button">${esc(L.comparer)}</button>
    </div></div>`;
}

function mouvement(m, classe) {
  const info = etat.cas[m.cas] ?? {};
  const val = (v) => JSON.stringify(v ?? null);
  return `<div class="mouv ${classe}">
    <div class="id">${esc(m.cas)}</div>
    <div class="entree">${esc(JSON.stringify(info.entree))}</div>
    <div class="pq">${esc(info.pourquoi?.[langue] ?? "")}</div>
    <div class="chg"><span class="av">${esc(val(m.avant.obtenu))}</span> → <span class="ap">${esc(val(m.apres.obtenu))}</span></div>
  </div>`;
}

function blocComparaison() {
  const L = t();
  $("#titreComparaison").textContent = L.titreComparaison;
  let html = blocChoix();

  if (comparaison && comparaison.erreur) {
    // Peut arriver si une exécution disparaît entre le chargement de l'écran et le clic.
    html += `<div class="verdict neutre"><div class="t">${esc(L.incomparable)}</div>
      <div class="d">${esc(L.incomparableQuoi)}</div></div>`;
  } else if (comparaison) {
    const c = comparaison;
    const a = pc(c.tauxAvant), b = pc(c.tauxApres);
    const carte = c.verdict === "regression"
      ? { cl: "mauvais", t: L.regression(c.regressions.length), d: L.regressionQuoi(c.gains.length, a, b) }
      : c.verdict === "amelioration"
      ? { cl: "bon", t: L.amelioration(c.gains.length), d: L.ameliorationQuoi(a, b) }
      : c.verdict === "neutre"
      ? { cl: "neutre", t: L.neutre, d: L.neutreQuoi(b) }
      : { cl: "neutre", t: L.incomparable, d: L.incomparableQuoi };

    html += `<div class="verdict ${carte.cl}"><div class="t">${esc(carte.t)}</div>
      <div class="d">${esc(carte.d)}</div></div>`;

    // Les cassés d'abord, toujours. C'est l'information qu'on vient chercher.
    if (c.regressions.length) html += `<h2 style="margin-top:22px">${esc(L.casses)}</h2>` +
      c.regressions.map((m) => mouvement(m, "casse")).join("");
    if (c.gains.length) html += `<h2 style="margin-top:22px">${esc(L.repares)}</h2>` +
      c.gains.map((m) => mouvement(m, "repare")).join("");

    const notes = [];
    if (c.silencieux.length) notes.push(L.silencieux(c.silencieux.length));
    if (c.ajoutes.length || c.retires.length) notes.push(L.jeuBouge(c.ajoutes.length, c.retires.length));
    if (notes.length) html += `<div class="carte"><div class="quoi">${notes.map(esc).join("<br>")}</div></div>`;
  }

  $("#comparaison").innerHTML = html;
  $("#av").onchange = (e) => { choixAvant = e.target.value; };
  $("#ap").onchange = (e) => { choixApres = e.target.value; };
  $("#cmp").onclick = () => agir(async () => {
    comparaison = await api(`/api/comparer?avant=${encodeURIComponent(choixAvant)}&apres=${encodeURIComponent(choixApres)}`);
  });
}

function blocStabilite() {
  const L = t();
  $("#titreStabilite").textContent = L.titreStabilite;
  let html = `<div class="carte"><div class="quoi">${esc(L.stabiliteQuoi)}</div>
    <div class="choix"><button class="b" id="stab" type="button">${esc(L.lancerStabilite)}</button></div></div>`;

  if (stabilite) {
    const instables = stabilite.versions.filter((v) => !v.stable);
    html += instables.length === 0
      ? `<div class="vide">${esc(L.toutStable)}</div>`
      : instables.flatMap((v) => v.instables.map((c) =>
          `<div class="instable">${esc(L.instable(v.version, c, stabilite.tours))}</div>`)).join("");
  } else {
    html += `<div class="vide">${esc(L.aucuneMesure)}</div>`;
  }

  $("#stabilite").innerHTML = html;
  $("#stab").onclick = () => agir(async () => { stabilite = await api("/api/stabilite?tours=8", "POST"); });
}

function dessiner() {
  const L = t();
  document.documentElement.lang = langue;
  $("#h1").textContent = L.h1;
  $("#lede").textContent = L.lede;
  $("#fr").className = langue === "fr" ? "on" : "";
  $("#en").className = langue === "en" ? "on" : "";
  blocVersions(); blocComparaison(); blocStabilite();
}

async function agir(travail) {
  if (occupe) return;
  occupe = true;
  for (const b of document.querySelectorAll("button.b")) b.disabled = true;
  try { await travail(); dessiner(); }
  finally {
    occupe = false;
    for (const b of document.querySelectorAll("button.b")) b.disabled = false;
  }
}

async function charger() { etat = await api("/api/etat"); }

for (const l of ["fr", "en"]) {
  $(`#${l}`).onclick = () => { langue = l; localStorage.setItem("langue", l); dessiner(); };
}

await charger();
dessiner();
</script>
</body>
</html>
