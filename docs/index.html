<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Banc de régression</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fbfaf7'/%3E%3Crect x='2' y='4' width='12' height='1' fill='%23111'/%3E%3Crect x='2' y='7' width='12' height='1' fill='%23111'/%3E%3Crect x='2' y='11' width='12' height='2' fill='%23111'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="registre.css" />
</head>
<body>
<main>
  <div class="haut">
    <div><h1 id="h1"></h1><p class="lede" id="lede"></p></div>
    <div class="lang"><button id="fr" type="button">FR</button><button id="en" type="button">EN</button></div>
  </div>
<p class="renvoi" style="margin-bottom:1.5rem">
This runs entirely in your browser — no server, no data leaves your machine, and the runs
you produce are yours alone. The watchlist and the 22 cases are <b>invented</b>; a real
sanctions list runs to hundreds of thousands of entries and cannot be published.
<a href="https://github.com/ArslaneSempai-ui/regression-bench">Source and method</a>.
</p>

  <h2 id="titreVersions"></h2>
  <div id="versions"></div>

  <h2 id="titreComparaison"></h2>
  <div id="comparaison"></div>

  <h2 id="titreStabilite"></h2>
  <div id="stabilite"></div>

  <p class="renvoi" id="provenanceLegende"></p>
</main>

<script type="module">
import { run, save, load, runs } from "./js/bench.js";
import { CASES } from "./js/cases.js";
import { REFERENCE_STABILITE } from "./js/reference-stabilite.js";
import { VERSIONS } from "./js/screening.js";
import { compare } from "./js/diff.js";
import { measureStability } from "./js/stability.js";

const byCase = Object.fromEntries(CASES.map((c) => [c.id, { input: c.input, why: c.why }]));
const summary = () => runs().map((e) => ({
  version: e.version, le: e.le, passed: e.passed, total: e.total, rate: e.rate,
}));

/* Le résultat de chaque cas, version par version — la grille de l'écran. Le serveur le
 * calcule aussi ; il est ici parce que la démo n'a pas de serveur, et qu'un champ oublié
 * ne casse rien : il laisse une section vide en ligne, pendant des semaines. */
const grille = () => ({
  cas: CASES.map((c) => c.id),
  reference: REFERENCE_STABILITE,
  versions: runs().map((e) => ({
    version: e.version,
    passes: CASES.map((c) => e.results.find((r) => r.caseId === c.id)?.passed ?? null),
  })),
});

async function runAll() {
  for (const [name, system] of Object.entries(VERSIONS)) save(await run(name, system, CASES));
}

/*
 * La démo arrive avec ses quatre exécutions déjà faites.
 *
 * Elle démarrait vide, comme un clone frais : c'était fidèle, et c'était le mauvais
 * arbitrage. Les deux figures qui portent la thèse — les barres et la grille des cas —
 * n'existaient pas tant que personne n'avait cliqué, et un visiteur qui passe trente
 * secondes sur la page repartait sans avoir vu ce que l'outil démontre.
 *
 * Rien n'est mis en conserve pour autant : les quatre versions tournent vraiment, dans le
 * navigateur, sur les vingt-deux cas. Le bouton « relancer » fait toujours exactement la
 * même chose, et la première demande d'état l'attend au lieu de renvoyer un banc vide.
 * L'amorçage n'a lieu qu'une fois : on garde la promesse, pas le résultat, donc deux
 * appels concurrents au chargement ne lancent pas huit exécutions.
 *
 * (Pas d'accent grave dans ce bloc : il vit lui-même dans un gabarit.)
 */
let amorce = null;

window.LOCAL = async (chemin, methode) => {
  if (chemin === "/api/state") {
    await (amorce ??= runAll());
    return { runs: summary(), cases: byCase, totalCases: CASES.length, grille: grille() };
  }
  if (chemin === "/api/run") { await runAll(); return { runs: summary() }; }

  if (chemin.startsWith("/api/compare")) {
    const q = new URLSearchParams(chemin.split("?")[1] ?? "");
    const a = load(q.get("before") ?? ""), b = load(q.get("after") ?? "");
    if (!a || !b) return { error: "execution_introuvable" };
    return compare(a, b);
  }

  if (chemin.startsWith("/api/stability")) {
    const q = new URLSearchParams(chemin.split("?")[1] ?? "");
    const rounds = Number(q.get("runs") ?? 8);
    const versions = [];
    for (const [name, system] of Object.entries(VERSIONS)) {
      versions.push(await measureStability(name, system, CASES, rounds));
    }
    return { runs: rounds, versions };
  }
  return {};
};
</script>
<script type="module">
import { empile, grille, brancher as brancherFigures } from "./graphes.js";
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
/*
 * One screen, two hosts.
 *
 * Run locally, this talks to the Node server. Published to GitHub Pages there is no server,
 * so the bench runs in the browser and `window.LOCAL` answers the same routes with the same
 * shapes. Keeping one file rather than two means the hosted demo cannot drift from the
 * tool — which is the only way a demo stays worth clicking.
 */
const api = async (pathFor, methode) =>
  window.LOCAL ? window.LOCAL(pathFor, methode)
    : (await fetch(pathFor, methode ? { method: methode } : {})).json();

/**
 * Les deux langues.
 *
 * Le moteur ne fabrique aucune phrase : il renvoie des structures, l'écran les formule.
 * La leçon vient du projet précédent, où un moteur français alimentait un écran anglais.
 */
const T = {
  fr: {
    h1: "Banc de régression",
    provenance: "Chaque chiffre de cette page est <b>retrouvé</b> dans un texte public, <b>mesuré</b> en faisant tourner le code, <b>supposé</b> parce que personne ici ne peut le connaître, ou <b>choisi</b> par moi. Le README dit lequel, un par un.",
    lede: "Un banc qui ne donne pas une note, mais dit ce qui a changé.",
    titreVersions: "Les versions évaluées",
    versionsQuoi: (n) => `Le même jeu de ${n} cas de contrôle, passé sur quatre versions successives d'un criblage de noms contre une liste de sanctions.`,
    relancer: "Relancer les quatre versions",
    titreComparaison: "Comparer deux versions",
    comparer: "Comparer", avant: "avant", apres: "après",

    regression: (n) => `${n} régression${n > 1 ? "s" : ""} — changement suspect`,
    regressionQuoi: (g, a, b) => g > 0
      ? `Le taux passe de ${a} à ${b}, et pourtant des cas validés ne passent plus. Une moyenne qui monte ne rachète pas un comportement qu'on ne sait plus expliquer.`
      : `Le taux passe de ${a} à ${b}.`,
    amelioration: (n) => `${n} gain${n > 1 ? "s" : ""}, aucune régression`,
    ameliorationQuoi: (a, b) => `${a} → ${b}. Rien de ce qui marchait n'a cessé de marcher.`,
    neutre: "Aucun changement de verdict",
    neutreQuoi: (b) => `${b} des deux côtés, cas par cas.`,
    incomparable: "Rien à comparer",
    incomparableQuoi: "Ces deux exécutions n'ont aucun cas en commun.",

    casses: "Ce qui ne marche plus", repares: "Ce qui marche désormais",
    silencieux: (n) => `${n} cas au verdict inchangé mais à la sortie différente`,
    jeuBouge: (a, r) => `Jeu modifié : ${a} cas ajouté(s), ${r} retiré(s) — la comparaison est partielle.`,

    titreStabilite: "Stabilité",
    stabiliteQuoi: "Un cas qui réussit sept fois sur huit n'est pas un cas qui réussit.",
    figVersionsTitre: "Ce que chaque version fait passer",
    figVersionsAria: "Une barre par version, coupée en cas réussis et cas échoués sur le même jeu de vingt-deux : le bloc des échecs se réduit d'une version à l'autre puis cesse de bouger.",
    figDiffTitre: "Avant, après",
    figDiffAria: "Deux barres empilées : les cas réussis et échoués de la version d'avant, puis de celle d'après.",
    segReussis: "réussis", segEchoues: "échoués",
    figGrilleTitre: (n, v) => `${n} cas × ${v} versions — un trou dans une colonne est une régression`,
    mesureeLe: (d, t) => `Mesuré le ${d} sur ${t} tours, et livré avec la page : une des versions court après une horloge, donc rejouer la mesure ne donne pas deux fois le même résultat.`,
    figGrilleAria: "Grille des cas par version. Chaque colonne est un cas, chaque ligne une version. "
      + "Une case vide entourée de rouge est un cas qui passait à la version précédente et ne passe plus.",
    grilleOk: "passe", grilleKo: "échoue déjà",
    grilleCasse: "cassé par cette version", grilleRepare: "réparé par cette version",
    grilleInstable: "instable : ne passe pas toujours",
    grilleSuite: (v, repare, casse) => `<b>${v}</b> répare ${repare} cas et en casse ${casse}`
      + " — pendant que son taux monte. Aucun taux ne dit ça ; la grille le dit sans commentaire.",
    grilleRien: "Aucune version ne casse un cas que la précédente réussissait.",
    lancerStabilite: "Remesurer sur 8 tours",
    stable: "stable",
    instable: (n, c, tours) => `${n} — ${c.caseId} : ${c.passes}/${tours}, sorties observées : ${c.outputs.join(" / ")}`,
    toutStable: "Toutes les versions sont stables.",
    aucuneMesure: "Pas encore mesuré.",
    aucun: "aucun", calcul: "Calcul…",
  },
  en: {
    h1: "Regression bench",
    provenance: "Every figure on this page is <b>retrieved</b> from a public source, <b>measured</b> by running the code, <b>assumed</b> because nobody here can know it, or <b>chosen</b> by me. The README says which, one by one.",
    lede: "A bench that doesn't hand you a score — it tells you what changed.",
    titreVersions: "The versions under test",
    versionsQuoi: (n) => `The same set of ${n} check cases, run against four successive versions of a name screening system matching against a sanctions list.`,
    relancer: "Re-run all four versions",
    titreComparaison: "Compare two versions",
    compare: "Compare", before: "before", after: "after",

    regression: (n) => `${n} regression${n > 1 ? "s" : ""} — change is suspect`,
    regressionQuoi: (g, a, b) => g > 0
      ? `The rate moves from ${a} to ${b}, and yet cases that were validated no longer pass. A rising average doesn't buy back behaviour you can no longer explain.`
      : `The rate moves from ${a} to ${b}.`,
    amelioration: (n) => `${n} gain${n > 1 ? "s" : ""}, no regression`,
    ameliorationQuoi: (a, b) => `${a} → ${b}. Nothing that worked stopped working.`,
    neutre: "No change in verdict",
    neutreQuoi: (b) => `${b} on both sides, case by case.`,
    incomparable: "Nothing to compare",
    incomparableQuoi: "These two runs share no cases.",

    casses: "What stopped working", repares: "What works now",
    silent: (n) => `${n} case(s) with an unchanged verdict but a different output`,
    jeuBouge: (a, r) => `Case set changed: ${a} added, ${r} removed — the comparison is partial.`,

    titreStabilite: "Stability",
    stabiliteQuoi: "A case that passes seven times out of eight isn't a case that passes.",
    figVersionsTitre: "What each version gets through",
    figVersionsAria: "One bar per version, split into cases passed and cases failed on the same set of twenty-two: the failure block shrinks from one version to the next then stops moving.",
    figDiffTitre: "Before, after",
    figDiffAria: "Two stacked bars: passed and failed cases of the before version, then of the after one.",
    segReussis: "passed", segEchoues: "failed",
    figGrilleTitre: (n, v) => `${n} cases × ${v} versions — a hole in a column is a regression`,
    mesureeLe: (d, t) => `Measured on ${d} over ${t} rounds and shipped with the page: one version races a clock, so re-running the measurement does not give the same answer twice.`,
    figGrilleAria: "Grid of cases by version. Each column is a case, each row a version. "
      + "An empty cell outlined in red is a case that passed on the previous version and no longer does.",
    grilleOk: "passes", grilleKo: "already failing",
    grilleCasse: "broken by this version", grilleRepare: "fixed by this version",
    grilleInstable: "unstable: does not always pass",
    grilleSuite: (v, repare, casse) => `<b>${v}</b> fixes ${repare} cases and breaks ${casse}`
      + " — while its rate goes up. No rate says that; the grid says it without a word.",
    grilleRien: "No version breaks a case the previous one passed.",
    lancerStabilite: "Measure again over 8 runs",
    stable: "stable",
    instable: (n, c, runs) => `${n} — ${c.caseId}: ${c.passes}/${runs}, outputs seen: ${c.outputs.join(" / ")}`,
    toutStable: "Every version is stable.",
    aucuneMesure: "Not measured yet.",
    aucun: "none", calcul: "Measuring…",
  },
};

let langue = localStorage.getItem("langue") === "fr" ? "fr" : "en";
const t = () => T[langue];
const pc = (x) => (x * 100).toFixed(1) + " %";

let state = null, comparaison = null, stabilite = null, occupe = false;
let choixAvant = null, choixApres = null;

function blocVersions() {
  const L = t();
  $("#titreVersions").textContent = L.titreVersions;

  /*
   * Les vingt-deux cas, version par version.
   *
   * Les barres au-dessus disent le taux, et le taux est exactement ce que cet outil
   * accuse : il monte pendant qu'un cas casse. La grille met les deux dans la même image —
   * la barre s'allonge, et deux trous apparaissent dans les colonnes.
   */
  const g = state.grille;
  /*
   * La grille vient de la mesure de stabilité, pas d'une exécution isolée.
   *
   * Une exécution unique d'une version instable est un pile ou face : sur la même page,
   * la case pouvait être rouge « cassé par cette version » pendant que la mesure de
   * stabilité, juste en dessous, jugeait le cas stable. Deux tirages, deux vérités. En
   * lisant les deux dans le même échantillon — huit tours — la contradiction devient
   * impossible plutôt qu'improbable : toujours réussi, toujours échoué, ou entre les deux.
   *
   * Les barres au-dessus restent une exécution simple, et c'est assumé : elles montrent le
   * taux qu'on lit d'habitude, celui-là même qui cache la casse.
   */
  const ref = stabiliteReference();
  const mesureDe = (version) => ref?.versions.find((v) => v.version === version) ?? null;
  const figGrille = grille({
    colonnes: g.cas,
    lignes: g.versions.map((v) => {
      const m = mesureDe(v.version);
      const flous = new Set((m?.unstable ?? []).map((c) => c.caseId));
      const surs = m
        ? g.cas.map((id) => (m.passesParCas?.[id] ?? 0) === m.rounds)
        : v.passes;
      return {
        nom: v.version,
        cellules: surs,
        instables: g.cas.map((id) => flous.has(id)),
        bout: `${surs.filter(Boolean).length}/${g.cas.length}`,
      };
    }),
    legende: [
      { texte: L.grilleOk, etat: "ok" }, { texte: L.grilleKo, etat: "ko" },
      { texte: L.grilleCasse, etat: "casse" }, { texte: L.grilleRepare, etat: "repare" },
      ...(ref?.versions.some((v) => !v.stable) ? [{ texte: L.grilleInstable, etat: "instable" }] : []),
    ],
    aria: L.figGrilleAria,
  });

  /* La phrase nomme la version qui casse le plus, sans la choisir à la main. */
  /* Le même échantillon que la grille : le bilan écrit sous la figure doit décrire la
   * figure, pas une autre exécution. */
  const surs = (v) => {
    const m = mesureDe(v.version);
    return m ? g.cas.map((id) => (m.passesParCas?.[id] ?? 0) === m.rounds) : v.passes;
  };
  const bilans = g.versions.slice(1).map((v, i) => {
    const avant = surs(g.versions[i]);
    const ici = surs(v);
    const flous = new Set((mesureDe(v.version)?.unstable ?? []).map((c) => c.caseId));
    const ferme = (j) => !flous.has(g.cas[j]);
    return {
      version: v.version,
      repare: ici.filter((p, j) => p && avant[j] === false && ferme(j)).length,
      /* Une casse annoncée doit être une casse : un cas instable est compté à part, sinon
       * la phrase sous la figure accuse une version d'une régression qui n'existe pas. */
      casse: ici.filter((p, j) => p === false && avant[j] === true && ferme(j)).length,
    };
  });
  const pire = bilans.slice().sort((a, b) => b.casse - a.casse)[0];
  const suiteGrille = pire && pire.casse > 0
    ? L.grilleSuite(esc(pire.version), pire.repare, pire.casse)
    : L.grilleRien;
  $("#versions").innerHTML = `
    <div class="feuillet"><div class="quoi">${esc(L.versionsQuoi(state.totalCases))}</div>
      <div class="rang"><button class="b" id="relancer" type="button">${esc(L.relancer)}</button></div></div>
    <section class="feuillet"><div class="corps">
      <div class="titre-fig">${esc(L.figVersionsTitre)}</div>
      ${empile({
        /* Le total est le même pour les quatre versions : c'est le taux qu'on vient lire,
         * et il remplace la liste de lignes qui répétait la figure mot pour mot. */
        items: state.runs.map((e) => ({ nom: e.version, bout: pc(e.rate), parts: [
          { nom: L.segReussis, valeur: e.passed, ton: "accent" },
          { nom: L.segEchoues, valeur: e.total - e.passed, ton: "neutre" },
        ] })),
        fmt: (v) => String(Math.round(v)),
        aria: L.figVersionsAria,
      })}

      <div class="titre-fig">${esc(L.figGrilleTitre(state.totalCases, state.runs.length))}</div>
      ${figGrille}
      <div class="suite">${suiteGrille}</div>
    </div></section>`;

  brancherFigures($("#versions"));
  $("#relancer").onclick = async () => {
    await agir(async () => { const r = await api("/api/run", "POST"); state.runs = r.runs; await charger(); });
  };
}

function blocChoix() {
  const L = t();
  const noms = state.runs.map((e) => e.version);
  if (!noms.includes(choixAvant)) choixAvant = noms[1] ?? noms[0];
  if (!noms.includes(choixApres)) choixApres = noms[2] ?? noms[noms.length - 1];

  const options = (choisi) => noms.map((n) =>
    `<option value="${esc(n)}"${n === choisi ? " selected" : ""}>${esc(n)}</option>`).join("");

  return `<div class="feuillet"><div class="rang">
      <label class="quoi" for="av">${esc(L.before)}</label>
      <select id="av" aria-label="${esc(L.before)}">${options(choixAvant)}</select>
      <label class="quoi" for="ap">${esc(L.after)}</label>
      <select id="ap" aria-label="${esc(L.after)}">${options(choixApres)}</select>
      <button class="b" id="cmp" type="button">${esc(L.compare)}</button>
    </div></div>`;
}

function mouvement(m, classe) {
  const info = state.cases[m.cas] ?? {};
  const val = (v) => JSON.stringify(v ?? null);
  return `<div class="ligne">
    <span class="intitule"><span class="reference">${esc(m.cas)}</span>
      ${esc(JSON.stringify(info.input))}
      <small>${esc(info.why?.[langue] ?? "")}</small></span>
    <span class="valeur ${classe === "casse" ? "defavorable" : "favorable"}">
      ${esc(val(m.before.actual))} \u2192 ${esc(val(m.after.actual))}</span>
  </div>`;
}

function blocComparaison() {
  const L = t();
  $("#titreComparaison").textContent = L.titreComparaison;
  let html = blocChoix();

  if (comparaison && comparaison.error) {
    // Peut arriver si une exécution disparaît entre le chargement de l'écran et le clic.
    html += `<div class="verdict neutre"><div class="t">${esc(L.incomparable)}</div>
      <div class="d">${esc(L.incomparableQuoi)}</div></div>`;
  } else if (comparaison) {
    const c = comparaison;
    const a = pc(c.rateBefore), b = pc(c.rateAfter);
    const carte = c.verdict === "regression"
      ? { cl: "mauvais", t: L.regression(c.regressions.length), d: L.regressionQuoi(c.gains.length, a, b) }
      : c.verdict === "amelioration"
      ? { cl: "bon", t: L.amelioration(c.gains.length), d: L.ameliorationQuoi(a, b) }
      : c.verdict === "neutre"
      ? { cl: "neutre", t: L.neutre, d: L.neutreQuoi(b) }
      : { cl: "neutre", t: L.incomparable, d: L.incomparableQuoi };

    const solde = c.verdict === "regression" ? "defavorable"
      : c.verdict === "amelioration" ? "favorable" : "attente";
    /* Le bloc gris est le sujet : on regarde s'il rétrécit, et surtout s'il a changé de
     * composition — un solde nul peut cacher trois réparés et trois cassés. */
    html += `<section class="feuillet"><div class="corps">
      <div class="titre-fig">${esc(L.figDiffTitre)}</div>
      ${empile({
        items: [
          { nom: c.before, parts: [
            { nom: L.segReussis, valeur: Math.round(c.rateBefore * state.totalCases), ton: "accent" },
            { nom: L.segEchoues, valeur: state.totalCases - Math.round(c.rateBefore * state.totalCases), ton: "neutre" } ], bout: pc(c.rateBefore) },
          { nom: c.after, parts: [
            { nom: L.segReussis, valeur: Math.round(c.rateAfter * state.totalCases), ton: "accent" },
            { nom: L.segEchoues, valeur: state.totalCases - Math.round(c.rateAfter * state.totalCases), ton: "neutre" } ], bout: pc(c.rateAfter) },
        ],
        fmt: (v) => String(Math.round(v)),
        aria: L.figDiffAria,
      })}
      <div class="ligne"><span class="intitule">${esc(L.before)} · ${esc(c.before)}</span>
        <span class="valeur">${pc(c.rateBefore)}</span></div>
      <div class="ligne"><span class="intitule">${esc(L.after)} · ${esc(c.after)}</span>
        <span class="valeur">${pc(c.rateAfter)}</span></div>
      <div class="ligne"><span class="intitule">${esc(L.repares)}</span>
        <span class="valeur">+${c.gains.length}</span></div>
      <div class="ligne"><span class="intitule">${esc(L.casses)}</span>
        <span class="valeur">\u2212${c.regressions.length}</span></div>
      <div class="ligne total ${solde}"><span class="intitule">${esc(carte.t)}</span>
        <span class="valeur">${c.regressions.length ? "\u2717" : c.gains.length ? "\u2713" : "="}</span></div>
      <div class="renvoi ${solde === "defavorable" ? "defavorable" : ""}">${esc(carte.d)}</div>
    </div></section>`;

    // Les cassés d'abord, toujours. C'est l'information qu'on vient chercher.
    if (c.regressions.length) html += `<section class="feuillet"><div class="intitule">${esc(L.casses)}</div>
      <div class="corps">${c.regressions.map((m) => mouvement(m, "casse")).join("")}</div></section>`;
    if (c.gains.length) html += `<section class="feuillet"><div class="intitule">${esc(L.repares)}</div>
      <div class="corps">${c.gains.map((m) => mouvement(m, "repare")).join("")}</div></section>`;

    const notes = [];
    if (c.silent.length) notes.push(L.silent(c.silent.length));
    if (c.added.length || c.removed.length) notes.push(L.jeuBouge(c.added.length, c.removed.length));
    if (notes.length) html += `<div class="feuillet"><div class="quoi">${notes.map(esc).join("<br>")}</div></div>`;
  }

  $("#comparaison").innerHTML = html;
  $("#av").onchange = (e) => { choixAvant = e.target.value; };
  $("#ap").onchange = (e) => { choixApres = e.target.value; };
  $("#cmp").onclick = () => agir(async () => {
    comparaison = await api(`/api/compare?before=${encodeURIComponent(choixAvant)}&after=${encodeURIComponent(choixApres)}`);
  });
}

function blocStabilite() {
  const L = t();
  $("#titreStabilite").textContent = L.titreStabilite;
  let html = `<div class="feuillet"><div class="quoi">${esc(L.stabiliteQuoi)}</div>
    <div class="rang"><button class="b" id="stab" type="button">${esc(L.lancerStabilite)}</button></div></div>`;

  /* La référence tant que le visiteur n'a rien relancé : « pas encore mesuré » était faux,
   * la mesure est dans le dépôt. */
  const m = stabilite ?? stabiliteReference();
  if (m) {
    const unstable = m.versions.filter((v) => !v.stable);
    html += unstable.length === 0
      ? `<div class="vide">${esc(L.toutStable)}</div>`
      : unstable.flatMap((v) => v.unstable.map((c) =>
          `<div class="renvoi attention">${esc(L.instable(v.version, c, m.runs))}</div>`)).join("");
    if (!stabilite && m.mesureLe) {
      html += `<div class="renvoi">${esc(L.mesureeLe(new Date(m.mesureLe).toLocaleDateString(langue === "fr" ? "fr-FR" : "en-GB"), m.runs))}</div>`;
    }
  } else {
    html += `<div class="vide">${esc(L.aucuneMesure)}</div>`;
  }

  $("#stabilite").innerHTML = html;
  $("#stab").onclick = () => agir(async () => { stabilite = await api("/api/stability?runs=8", "POST"); });
}

function dessiner() {
  const L = t();
  document.documentElement.lang = langue;
  $("#h1").textContent = L.h1;
  $("#provenanceLegende").innerHTML = L.provenance;
  $("#lede").textContent = L.lede;
  $("#fr").className = langue === "fr" ? "on" : "";
  $("#en").className = langue === "en" ? "on" : "";
  blocVersions(); blocComparaison(); blocStabilite();
}

async function agir(travail) {
  if (occupe) return;
  occupe = true;
  for (const b of document.querySelectorAll("button.b")) b.disabled = true;
  try { await travail(); dessiner(); }
  finally {
    occupe = false;
    for (const b of document.querySelectorAll("button.b")) b.disabled = false;
  }
}

async function charger() { state = await api("/api/state"); }

/*
 * La stabilité de référence : mesurée une fois, livrée avec le build.
 *
 * Elle a d'abord été mesurée au chargement, huit tours, ce qui coûtait cinq millisecondes
 * — et le chiffre bougeait quand même d'une visite à l'autre. La raison n'est pas la
 * taille de l'échantillon : `v4-sous-budget` court après une horloge, donc son taux de
 * réussite dépend de la charge de la machine. Mesuré : sur huit cent tours répétés,
 * `faute-01` est passé de 95,50 % à 99,88 % de réussite, très au-delà du bruit
 * d'échantillonnage. Il n'existe pas de nombre de tours qui fige ça.
 *
 * Alors on fige par la mesure, comme le reste du portfolio : quatre cents tours, une fois,
 * datés, écrits dans le dépôt. La grille lit ça et montre la même chose à chaque visite.
 * Le bouton en dessous rejoue une mesure en direct — et voir l'ensemble bouger est
 * précisément ce que ce banc a à dire.
 */
const stabiliteReference = () => {
  const r = state?.grille?.reference;
  if (!r) return null;
  return {
    runs: r.tours,
    mesureLe: r.mesureLe,
    versions: Object.entries(r.versions).map(([version, parCas]) => {
      const unstable = Object.entries(parCas)
        .filter(([, n]) => n !== 0 && n !== r.tours)
        .map(([caseId, n]) => ({ caseId, passes: n, rounds: r.tours, outputs: [] }));
      /* `passesParCas` est ce que la grille lit pour chaque case : l'oublier ici rendait
       * toute la grille vide, avec des compteurs à 0/22 — et rien ne levait d'erreur. */
      return { version, rounds: r.tours, unstable, stable: unstable.length === 0, passesParCas: parCas };
    }),
  };
};

for (const l of ["fr", "en"]) {
  $(`#${l}`).onclick = () => { langue = l; localStorage.setItem("langue", l); dessiner(); };
}

await charger();
dessiner();
</script>
</body>
</html>
